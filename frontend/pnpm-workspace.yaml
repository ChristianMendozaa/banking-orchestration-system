packages:
  - "."

allowBuilds:
  sharp: true
  unrs-resolver: false

# Quarantine window before resolving a newly published version: mitigates compromised
# packages published and detected shortly after (see npm supply-chain incidents).
minimumReleaseAge: 1440

# Explicit exception: patch version required by vulnerability scanning.
minimumReleaseAgeExclude:
  - postcss@8.5.24

overrides:
  "@hono/node-server@<2.0.10": "2.0.12"
  "brace-expansion@>=5.0.0 <=5.0.7": "5.0.8"
  "fast-uri@<3.1.5": "3.1.5"
  "hono@<4.12.34": "4.12.34"
  "ip-address@<10.3.1": "10.3.1"
  "js-yaml@<4.3.0": "4.3.0"
  "nanoid@<3.3.17": "3.3.17"
  "postcss@<=8.5.17": "8.5.24"
  "sharp@<0.35.0": "0.35.3"
