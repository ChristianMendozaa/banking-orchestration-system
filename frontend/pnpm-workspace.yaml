packages:
  - "."

allowBuilds:
  sharp: true
  unrs-resolver: false

# Ventana de cuarentena antes de resolver una versión recién publicada: mitiga paquetes
# comprometidos publicados y detectados poco después (ver incidentes de npm supply-chain).
minimumReleaseAge: 1440

# Excepción explícita: versión correctiva requerida por el control de vulnerabilidades.
minimumReleaseAgeExclude:
  - postcss@8.5.24

overrides:
  "@hono/node-server@<2.0.10": "2.0.12"
  "brace-expansion@>=5.0.0 <=5.0.7": "5.0.8"
  "fast-uri@<3.1.5": "3.1.5"
  "hono@<4.12.34": "4.12.34"
  "ip-address@<10.3.1": "10.3.1"
  "js-yaml@<4.3.0": "4.3.0"
  "nanoid@<3.3.17": "3.3.17"
  "postcss@<=8.5.17": "8.5.24"
  "sharp@<0.35.0": "0.35.3"
