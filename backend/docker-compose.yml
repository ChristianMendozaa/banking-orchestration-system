services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: orquestacion
      POSTGRES_USER: orquestacion
      POSTGRES_PASSWORD: orquestacion
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquestacion -d orquestacion"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orquestacion_pgdata:/var/lib/postgresql/data

volumes:
  orquestacion_pgdata:

