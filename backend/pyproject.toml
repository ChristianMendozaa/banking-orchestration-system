[project]
name = "sistema-orquestacion-backend"
version = "0.1.0"
description = "Backend for the banking service orchestration system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "cryptography>=50.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "langgraph>=1.2.11",
  "mcp>=2.0.0",
  "openai[realtime]>=1.99.0",
  "pgvector>=0.4.1",
  "psycopg[binary]>=3.2.9",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.10.0",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.20",
  "prometheus-client>=0.22.1",
  "pypdf>=6.15.0",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.41",
  "structlog>=25.4.0",
  "tiktoken>=0.9.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0",
  "coverage>=7.9.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "reportlab>=4.4.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped, not the pytest-asyncio default of function-scoped: app.main builds a
# module-level RedisRateLimiter once at import time (correct for production, where one
# process keeps one event loop for its whole life). Function-scoped test loops closed
# and recreated that connection's loop between tests, which redis-py's asyncio transport
# does not tolerate ("RuntimeError: Event loop is closed"). A session-scoped loop matches
# the single-loop lifetime the app is actually designed for instead of working around it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]
omit = [
  "app/db/seed.py",
  "app/knowledge/cli.py",
  "app/mcp_server/__main__.py",
  "app/mcp_server/server.py",
  "app/mcp_server/tools.py",
]
# "thread": langgraph's Pregel engine dispatches node/routing-function execution through
# a worker-thread pool (see langgraph/_internal/_runnable.py), which the default tracer
# does not follow without this -- same class of gap as SQLAlchemy's greenlet bridge below.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
