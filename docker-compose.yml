name: sistema-orquestacion

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
  DATABASE_MIGRATION_URL: postgresql+psycopg://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
  KNOWLEDGE_STORAGE_DIR: /workspace/data/knowledge
  KNOWLEDGE_SEED_DIR: /workspace/doc/rag
  RAG_CORPUS_DIR: /workspace/doc/rag
  SEED_DATA_PATH: /workspace/backend/seed/operational_seed.json
  ESTIMATED_SERVICE_MINUTES: ${ESTIMATED_SERVICE_MINUTES:-8}
  CORS_ORIGINS: ${KIOSK_FRONTEND_ORIGIN:-http://localhost:3000},${STAFF_FRONTEND_ORIGIN:-http://localhost:3001}

x-backend-base: &backend-base
  image: sistema-orquestacion-backend:local
  env_file:
    - path: backend/.env
      required: true
  environment: *backend-environment
  volumes:
    - knowledge_data:/workspace/data/knowledge

x-frontend-environment: &frontend-environment
  BACKEND_INTERNAL_URL: http://backend:8000
  HOSTNAME: 0.0.0.0
  PORT: 3000

x-frontend-base: &frontend-base
  image: sistema-orquestacion-frontend:local
  pull_policy: never
  restart: "no"
  environment: *frontend-environment
  depends_on:
    backend:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:?Defina POSTGRES_USER} -d ${POSTGRES_DB:?Defina POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    <<: *backend-base
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /workspace/backend/.venv/bin/alembic upgrade head
        /workspace/backend/.venv/bin/python -m app.db.seed

  knowledge-bootstrap:
    <<: *backend-base
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${OPENAI_API_KEY:-}" ]; then
          /workspace/backend/.venv/bin/python -m app.knowledge.cli ingest
        else
          echo "OPENAI_API_KEY ausente: se omite la indexacion inicial"
        fi

  backend:
    <<: *backend-base
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      knowledge-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - /workspace/backend/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend-kiosk:
    <<: *frontend-base
    # Este servicio construye la imagen compartida; frontend-staff reutiliza la misma.
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      <<: *frontend-environment
      APP_SURFACE: kiosk
    ports:
      - "${KIOSK_FRONTEND_PORT:-3000}:3000"

  frontend-staff:
    <<: *frontend-base
    environment:
      <<: *frontend-environment
      APP_SURFACE: staff
    ports:
      - "${STAFF_FRONTEND_PORT:-3001}:3000"

volumes:
  postgres_data:
  knowledge_data:
