name: sistema-orquestacion

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  DATABASE_MIGRATION_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  KNOWLEDGE_STORAGE_DIR: /workspace/data/knowledge
  RAG_CORPUS_DIR: /workspace/doc/rag
  SEED_DATA_PATH: /workspace/backend/seed/operational_seed.json
  ESTIMATED_SERVICE_MINUTES: ${ESTIMATED_SERVICE_MINUTES:-8}
  CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-90}
  CORS_ORIGINS: ${KIOSK_FRONTEND_ORIGIN:-http://localhost:3000},${STAFF_FRONTEND_ORIGIN:-http://localhost:3001}

x-backend-base: &backend-base
  image: sistema-orquestacion-backend:local
  env_file:
    - path: backend/.env
      required: true
  environment: *backend-environment
  volumes:
    - knowledge_data:/workspace/data/knowledge

x-frontend-environment: &frontend-environment
  BACKEND_INTERNAL_URL: http://backend:8000
  # The one backend origin the browser reaches directly: the kiosk voice WebSocket, which
  # cannot traverse the Next route-handler proxy that carries every other backend call.
  # Read at request time by the middleware and by the root layout, so it is a property of
  # the deployment rather than of the image.
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
  HOSTNAME: 0.0.0.0
  PORT: 3000

x-frontend-base: &frontend-base
  image: sistema-orquestacion-frontend:local
  pull_policy: never
  restart: "no"
  environment: *frontend-environment
  depends_on:
    backend:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Published for the "backend runs on the host, dependencies run in Compose" local
    # dev flow (backend/.env points REDIS_URL at localhost, not the compose network).
    # Not part of the deployment topology diagram or production guidance in the
    # README's Operational considerations section, which still calls for
    # internal-network-only access there.
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    restart: "no"
    # Same local-dev rationale as redis's port mapping above.
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  migrate:
    <<: *backend-base
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /workspace/backend/.venv/bin/alembic upgrade head
        /workspace/backend/.venv/bin/python -m app.db.seed

  knowledge-bootstrap:
    <<: *backend-base
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${OPENAI_API_KEY:-}" ]; then
          /workspace/backend/.venv/bin/python -m app.knowledge.cli ingest
        else
          echo "OPENAI_API_KEY ausente: se omite la indexacion inicial"
        fi

  backend:
    <<: *backend-base
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      knowledge-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - /workspace/backend/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  knowledge-worker:
    <<: *backend-base
    restart: unless-stopped
    depends_on:
      knowledge-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - /workspace/backend/.venv/bin/python
      - -m
      - app.knowledge.worker

  mcp-server:
    <<: *backend-base
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MCP_SERVER_PORT: "8100"
    depends_on:
      knowledge-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${MCP_SERVER_PORT:-8100}:8100"
    command:
      - /workspace/backend/.venv/bin/python
      - -m
      - app.mcp_server
    healthcheck:
      test:
        - CMD
        - /workspace/backend/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend-kiosk:
    <<: *frontend-base
    # This service builds the shared image; frontend-staff reuses it.
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      <<: *frontend-environment
      APP_SURFACE: kiosk
    ports:
      - "${KIOSK_FRONTEND_PORT:-3000}:3000"

  frontend-staff:
    <<: *frontend-base
    environment:
      <<: *frontend-environment
      APP_SURFACE: staff
    ports:
      - "${STAFF_FRONTEND_PORT:-3001}:3000"

volumes:
  postgres_data:
  knowledge_data:
