name: Set up frontend
description: Installs pnpm, Node.js, and the frontend dependencies with the frozen lockfile.

inputs:
  install-args:
    description: Additional arguments for pnpm install.
    required: false
    default: "--frozen-lockfile"

runs:
  using: composite
  steps:
    # pnpm/action-setup reads packageManager from a root package.json, which this repo
    # doesn't have (the frontend package lives in frontend/), so the version must be pinned
    # here and kept in sync with the "packageManager" field in frontend/package.json.
    - uses: pnpm/action-setup@v4
      with:
        version: 11.11.0

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - run: pnpm install ${{ inputs.install-args }}
      shell: bash
      working-directory: frontend
