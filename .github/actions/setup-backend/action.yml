name: Set up backend
description: Installs uv, Python, and syncs the backend dependencies with the lockfile.

inputs:
  python-version:
    description: Python version to install and use for uv sync.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    - run: uv python install ${{ inputs.python-version }}
      shell: bash

    - run: uv sync --locked --python ${{ inputs.python-version }}
      shell: bash
      working-directory: backend
